---
name: test
on:
  workflow_call:
    inputs:
      aqua_version:
        required: true
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
env:
  AQUA_LOG_COLOR: always
permissions: {}
jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      renovate-config-validator: ${{steps.changes.outputs.renovate-config-validator}}
      ghalint: ${{steps.changes.outputs.ghalint}}
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read # To get pull requests of private repository
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            renovate-config-validator:
              - renovate.json
              - renovate.json5
            ghalint:
              - .github/workflows/*.yml
              - .github/workflows/*.yaml

  renovate-config-validator:
    # Validate Renovate Configuration by renovate-config-validator.
    uses: suzuki-shunsuke/github-action-renovate-config-validator/.github/workflows/renovate-config-validator.yaml@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
    needs: path-filter
    if: needs.path-filter.outputs.renovate-config-validator == 'true'
    permissions:
      contents: read

  ghalint:
    # Validate GitHub Actions Workflows by ghalint.
    timeout-minutes: 15
    needs: path-filter
    if: needs.path-filter.outputs.ghalint == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ghalint
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: ghalint

      - name: Run ghalint
        run: ghalint run
        env:
          GHALINT_LOG_COLOR: always

  typos:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install typos
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: typos

      - name: Run typos
        run: typos
